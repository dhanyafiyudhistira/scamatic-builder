name: Windows signed release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-signed-release
  cancel-in-progress: false

jobs:
  build:
    name: Build verified NSIS installer
    runs-on: windows-latest
    timeout-minutes: 60
    environment: windows-release
    env:
      SCAMATIC_EXPECTED_PUBLISHER_THUMBPRINT: ${{ vars.SCAMATIC_WINDOWS_PUBLISHER_THUMBPRINT }}
      SCAMATIC_TIMESTAMP_URL: ${{ vars.SCAMATIC_WINDOWS_TIMESTAMP_URL }}
      SCAMATIC_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Require a protected release ref
        shell: pwsh
        run: |
          $defaultRef = "refs/heads/$env:SCAMATIC_DEFAULT_BRANCH"
          if ($env:GITHUB_REF_TYPE -ne 'tag' -and $env:GITHUB_REF -ne $defaultRef) {
            throw "Signed releases are restricted to tags or the default branch ($defaultRef)."
          }

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Import publisher certificate
        shell: pwsh
        env:
          SCAMATIC_WINDOWS_CERTIFICATE_BASE64: ${{ secrets.SCAMATIC_WINDOWS_CERTIFICATE_BASE64 }}
          SCAMATIC_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.SCAMATIC_WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SCAMATIC_WINDOWS_CERTIFICATE_BASE64)) {
            throw 'SCAMATIC_WINDOWS_CERTIFICATE_BASE64 is not configured.'
          }
          if ([string]::IsNullOrWhiteSpace($env:SCAMATIC_WINDOWS_CERTIFICATE_PASSWORD)) {
            throw 'SCAMATIC_WINDOWS_CERTIFICATE_PASSWORD is not configured.'
          }
          $expected = ($env:SCAMATIC_EXPECTED_PUBLISHER_THUMBPRINT -replace '\s', '').ToUpperInvariant()
          if ($expected -notmatch '^[A-F0-9]{40,64}$') {
            throw 'SCAMATIC_WINDOWS_PUBLISHER_THUMBPRINT is missing or invalid.'
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'scamatic-windows-signing.pfx'
          $certificateBytes = [Convert]::FromBase64String($env:SCAMATIC_WINDOWS_CERTIFICATE_BASE64)
          [IO.File]::WriteAllBytes($certificatePath, $certificateBytes)
          $password = ConvertTo-SecureString -String $env:SCAMATIC_WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $imported = @(Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation 'Cert:\CurrentUser\My' -Password $password)
          [IO.File]::WriteAllLines(
            (Join-Path $env:RUNNER_TEMP 'scamatic-imported-thumbprints.txt'),
            @($imported.Thumbprint)
          )
          if ($imported.Count -eq 0 -or $expected -notin @($imported.Thumbprint | ForEach-Object { ($_ -replace '\s', '').ToUpperInvariant() })) {
            throw 'Imported certificate does not match SCAMATIC_WINDOWS_PUBLISHER_THUMBPRINT.'
          }

      - name: Build, sign, and verify release
        shell: pwsh
        run: >-
          npm run desktop:release:windows --
          -ExpectedPublisherThumbprint $env:SCAMATIC_EXPECTED_PUBLISHER_THUMBPRINT
          -TimestampUrl $env:SCAMATIC_TIMESTAMP_URL

      - name: Remove signing material
        if: always()
        shell: pwsh
        run: |
          $thumbprintPath = Join-Path $env:RUNNER_TEMP 'scamatic-imported-thumbprints.txt'
          if (Test-Path -LiteralPath $thumbprintPath) {
            foreach ($thumbprint in Get-Content -LiteralPath $thumbprintPath) {
              $normalized = ($thumbprint -replace '\s', '').ToUpperInvariant()
              if ($normalized -match '^[A-F0-9]{40,64}$') {
                Remove-Item -LiteralPath "Cert:\CurrentUser\My\$normalized" -Force -ErrorAction SilentlyContinue
              }
            }
          }
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'scamatic-windows-signing.pfx') -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $thumbprintPath -Force -ErrorAction SilentlyContinue

      - name: Upload verified installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scamatic-builder-windows-signed
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/nsis/*-setup.exe.sha256
          if-no-files-found: error
          retention-days: 14
