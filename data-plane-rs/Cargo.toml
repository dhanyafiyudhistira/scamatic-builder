[package]
name = "scamatic-data-plane"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Private Rust shadow data-plane worker for SCAMATIC Builder"
license = "MIT"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
futures-util = { version = "=0.3.32", default-features = false, features = ["sink"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
tokio = { version = "1.53.1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
