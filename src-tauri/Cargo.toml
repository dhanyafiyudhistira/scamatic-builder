[package]
name = "scamatic-desktop"
version = "0.2.8"
edition.workspace = true
rust-version.workspace = true
description = "Connected desktop shell for SCAMATIC Builder and Runtime"
license.workspace = true

[lib]
name = "scamatic_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
local-runtime = []

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
base64 = "0.22"
futures-util = { version = "=0.3.32", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["brotli", "cookies", "gzip", "json", "rustls-tls"] }
scamatic-data-plane = { path = "../data-plane-rs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11.5", features = [] }
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
url = "2.5"
